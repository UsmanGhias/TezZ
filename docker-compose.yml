services:
  db:
    image: postgres:15
    container_name: teez_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_password}
      POSTGRES_DB: ${POSTGRES_DB:-teez_marketplace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teez_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teez_redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
             else
               redis-server --appendonly yes;
             fi'
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - teez_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teez_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"   # live chat / longpolling
    env_file:
      - .env
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_password}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./multi_vendor_App:/mnt/extra-addons:ro
    networks:
      - teez_network
    command: odoo --config=/etc/odoo/odoo.conf

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: teez_pgadmin
    restart: unless-stopped
    profiles: ["dev"]   # opt-in: `docker compose --profile dev up`
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@tezz.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - teez_network

  nginx:
    image: nginx:alpine
    container_name: teez_nginx
    restart: unless-stopped
    profiles: ["proxy"]   # opt-in: `docker compose --profile proxy up`
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - odoo
    networks:
      - teez_network

volumes:
  postgres_data:
    driver: local
  odoo_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  teez_network:
    driver: bridge
