[options]

; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_password
db_name = teez_marketplace

; Addons paths – Odoo built-in path + your custom modules
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Server
http_port = 8069
longpolling_port = 8072
proxy_mode = True

; Workers (set > 0 for production, 0 for development)
workers = 0

; Logging
logfile = /var/log/odoo/odoo.log
log_level = info

; Security
admin_passwd = admin_master_password_change_me

; Performance
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Email (configure before going to production)
; smtp_server = smtp.example.com
; smtp_port = 587
; smtp_ssl = True
; smtp_user = your@email.com
; smtp_password = yourpassword
; email_from = noreply@example.com
