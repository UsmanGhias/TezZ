# TezZ reverse-proxy site configuration.
# In production, terminate TLS here and uncomment the HTTPS server block.

server {
    listen 80;
    server_name _;

    # Real-IP forwarding so Odoo + tezz_api see the client address.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Mobile API — rate-limit and bypass any proxy caches.
    location /api/v1/ {
        proxy_pass http://odoo;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Live chat / longpolling
    location /websocket {
        proxy_pass http://odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # Default: Odoo web client
    location / {
        proxy_pass http://odoo;
        proxy_read_timeout 600s;
    }

    # Static files served by Odoo can be cached aggressively.
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_pass http://odoo;
        expires 864000;
    }
}

